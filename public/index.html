<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12"><title>VOLTA — Telefonlar do‘koni</title>
<style>
:root{--site-primary:#7657ff;--site-secondary:#111827;--site-background:#080b12;--site-on-primary:#fff;--site-on-secondary:#f8fafc;--site-on-background:#f8fafc;--site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--site-font-heading:Inter,ui-sans-serif,system-ui,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;--bg:#080b12;--panel:#111827;--muted:#98a2b3;--line:#273244;--accent:#8b72ff;--mint:#b7ff70}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:var(--site-font-body)}button,input{font:inherit}button{cursor:pointer}.root{min-height:100vh;background-color:var(--site-background);color:var(--site-on-background)}.topbar{height:76px;border-bottom:1px solid #202a3b;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);position:sticky;top:0;background:#080b12ed;backdrop-filter:blur(16px);z-index:5}.brand{font-weight:900;letter-spacing:.16em;font-size:22px}.brand span{color:var(--mint)}.toplinks{display:flex;align-items:center;gap:26px;color:#c3ccda;font-size:13px}.toplinks a{color:inherit;text-decoration:none}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:white;font-weight:750;box-shadow:0 8px 28px #7657ff35}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.ghost{background:#1b2433;border:1px solid #344054;box-shadow:none}.btn.small{padding:10px 14px;font-size:12px}.hero{padding:75px max(5vw,22px) 48px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:38px;max-width:1400px;margin:auto}.eyebrow{color:var(--mint);font-size:11px;letter-spacing:.22em;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.065em;margin:20px 0}.hero h1 em{font-style:normal;color:var(--accent)}.hero p{color:#aab4c4;line-height:1.75;max-width:490px}.hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.hero-art{min-height:390px;border-radius:30px;background:radial-gradient(circle at 50% 42%,#7657ff55,transparent 45%),linear-gradient(145deg,#171d2c,#0c111b);border:1px solid #293348;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid #ffffff12;border-radius:50%;width:370px;height:370px}.hero-art:after{width:500px;height:500px}.phone-visual{height:330px;width:175px;border-radius:34px;background:linear-gradient(140deg,#3a4255,#101521 55%,#252d42);border:4px solid #667085;box-shadow:0 25px 75px #0009;transform:rotate(-11deg);position:relative;z-index:1;padding:9px}.phone-screen{height:100%;border-radius:25px;background:radial-gradient(circle at 65% 30%,#ffb1dc,#6b58e7 35%,#10152c 70%);overflow:hidden;position:relative}.phone-screen:after{content:"";position:absolute;inset:55% -25% -20%;background:linear-gradient(130deg,#c8ff8c,#8a65ff);border-radius:50%}.camera{position:absolute;top:8px;left:50%;transform:translateX(-50%);height:16px;width:70px;border-radius:20px;background:#080b12;z-index:2}.float-tag{position:absolute;z-index:2;padding:13px 16px;border:1px solid #ffffff22;background:#131b2bd9;border-radius:14px;backdrop-filter:blur(12px);font-size:12px}.float-tag b{display:block;font-size:17px;margin-top:4px}.tag-one{left:7%;top:22%}.tag-two{right:7%;bottom:20%}.section{max-width:1400px;margin:auto;padding:42px max(5vw,22px) 85px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.section h2{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;margin:9px 0}.muted{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.product{background:linear-gradient(160deg,#151d2b,#0f1520);border:1px solid #283448;border-radius:22px;padding:20px;transition:.2s}.product:hover{transform:translateY(-4px);border-color:#7662d8}.product-art{height:210px;border-radius:16px;background:radial-gradient(circle at 50% 45%,#7a68dc55,transparent 55%),#0b111d;display:grid;place-items:center;margin-bottom:18px}.mini-phone{height:165px;width:85px;border-radius:18px;border:3px solid #667085;background:linear-gradient(145deg,#a7b6ff,#6951c9 45%,#111827);box-shadow:0 14px 30px #0008;position:relative}.mini-phone:before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);height:7px;width:30px;background:#111827;border-radius:9px}.product:nth-child(2) .mini-phone{background:linear-gradient(145deg,#e9d8c1,#9a806b 48%,#17202d)}.product:nth-child(3) .mini-phone{background:linear-gradient(145deg,#b7ff70,#398c83 48%,#17202d)}.product h3{margin:0 0 7px;font-size:18px}.product .desc{font-size:12px;color:#98a2b3;min-height:35px}.product-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.price{font-size:18px;font-weight:850}.product-bottom button{border:1px solid #45516a;background:#202b3d;color:white;border-radius:10px;padding:9px 12px;font-size:12px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px}.feature{border:1px solid #283448;background:#101724;border-radius:16px;padding:20px}.feature strong{display:block;margin:10px 0 5px}.feature p{margin:0;color:#98a2b3;font-size:12px;line-height:1.6}.footer{border-top:1px solid #202a3b;padding:25px max(5vw,22px);color:#8490a2;font-size:12px;display:flex;justify-content:space-between;gap:15px}.auth-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-left{padding:48px 8vw;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 20% 30%,#7657ff3b,transparent 35%),#090d16}.auth-copy h1{font-size:clamp(38px,5vw,62px);letter-spacing:-.06em;line-height:1.02;margin:18px 0}.auth-copy p{color:#aab4c4;max-width:410px;line-height:1.7}.auth-right{display:grid;place-items:center;padding:30px;background:#0d1320}.auth-card{width:min(420px,100%);padding:34px;border:1px solid #2b3548;background:#111a29;border-radius:24px;box-shadow:0 25px 80px #0005}.auth-card h2{font-size:28px;margin:0 0 8px}.auth-card>p{color:#98a2b3;font-size:13px;margin:0 0 26px}.field{display:block;margin:16px 0}.field span{display:block;font-size:12px;color:#c4ccda;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid #344054;border-radius:11px;background:#0b1220;color:white;outline:none}.field input:focus{border-color:#8b72ff;box-shadow:0 0 0 3px #8b72ff22}.auth-card .btn{width:100%;margin-top:8px}.switch{font-size:12px;text-align:center;color:#aab4c4;margin-top:20px}.switch a{color:#c0b4ff;cursor:pointer}.message{font-size:12px;color:#ffb4b4;min-height:18px;margin:10px 0}.hidden{display:none!important}.user-chip{font-size:12px;color:#bdc7d8}.user-chip button{margin-left:10px}@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:48px}.hero-art{min-height:310px}.products{grid-template-columns:repeat(2,1fr)}.auth-screen{grid-template-columns:1fr}.auth-left{display:none}.auth-right{min-height:100vh}}@media(max-width:560px){.toplinks a{display:none}.topbar{height:66px}.hero{padding-top:36px}.hero-art{min-height:280px}.products,.features{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.footer{flex-direction:column}.auth-card{padding:25px}}
</style></head>
<body><div class="root" id="app"></div>
<script>
const app=document.getElementById('app');let mode='login';let user=null;
const demoProducts=[{name:'iPhone 16 Pro',desc:'A18 Pro · 6.3-inch OLED · 48 MP kamera',price:'14 990 000 so‘m',tone:'violet'},{name:'Samsung Galaxy S25 Ultra',desc:'Galaxy AI · 200 MP kamera · S Pen',price:'16 490 000 so‘m',tone:'sand'},{name:'Google Pixel 9 Pro',desc:'Tensor G4 · AI kamera · OLED',price:'12 790 000 so‘m',tone:'green'}];
function authView(){app.innerHTML=`<main class="auth-screen"><section class="auth-left"><div class="brand">VOLT<span>A.</span></div><div class="auth-copy"><div class="eyebrow">SMARTER EVERY DAY</div><h1>Texnologiya<br><em>qo‘lingizda.</em></h1><p>Eng so‘nggi smartfonlar, zamonaviy dizayn va ishonchli tanlov — barchasi bir joyda.</p></div><div class="muted" style="font-size:11px">© 2026 VOLTA STORE</div></section><section class="auth-right"><form class="auth-card" id="authForm"><div class="eyebrow">VOLTA MEMBERS</div><h2>${mode==='login'?'Xush kelibsiz':'Hisob yarating'}</h2><p>${mode==='login'?'Davom etish uchun hisobingizga kiring.':'Yangi hisob ochib, katalog bilan tanishing.'}</p>${mode==='register'?'<label class="field"><span>Ismingiz</span><input name="name" placeholder="Ism Familiya" required minlength="2"></label>':''}<label class="field"><span>Email manzil</span><input name="email" type="email" placeholder="you@example.com" required></label><label class="field"><span>Parol</span><input name="password" type="password" placeholder="Kamida 8 ta belgi" required minlength="8"></label><div class="message" id="message"></div><button class="btn" type="submit">${mode==='login'?'Kirish':'Ro‘yxatdan o‘tish'} →</button><div class="switch">${mode==='login'?'Hisobingiz yo‘qmi?':'Hisobingiz bormi?'} <a id="switchMode">${mode==='login'?'Ro‘yxatdan o‘tish':'Kirish'}</a></div></form></section></main>`;
 document.getElementById('switchMode').onclick=()=>{mode=mode==='login'?'register':'login';authView()};
 document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload=Object.fromEntries(fd);const msg=document.getElementById('message');const submit=e.currentTarget.querySelector('button');submit.disabled=true;submit.textContent='Tekshirilmoqda…';try{const r=await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,...payload})});const data=await r.json();if(!r.ok)throw Error(data.error||'Xatolik yuz berdi');user=data.user;landingView()}catch(err){msg.textContent=err.message;submit.disabled=false;submit.textContent=mode==='login'?'Kirish →':'Ro‘yxatdan o‘tish →'}}
}
function landingView(){app.innerHTML=`<header class="topbar"><div class="brand">VOLT<span>A.</span></div><nav class="toplinks"><a href="#catalog">Katalog</a><a href="#why">Afzalliklar</a><span class="user-chip">${user?.name||user?.email||'Mijoz'} <button class="btn ghost small" id="logout">Chiqish</button></span></nav></header><main><section class="hero"><div><div class="eyebrow">YANGI AVLOD SMARTFONLARI</div><h1>Kelajakni<br><em>qo‘lingizda</em><br>his qiling.</h1><p>Har bir lahza uchun kuchli kamera, tezkor ishlash va o‘ziga xos dizayn. O‘zingizga mos smartfonni tanlang.</p><div class="hero-actions"><a class="btn" href="#catalog" style="text-decoration:none">Katalogni ko‘rish ↗</a><a class="btn ghost" href="#why" style="text-decoration:none">Nega VOLTA?</a></div></div><div class="hero-art"><div class="float-tag tag-one">YANGI KELDI<b>2026 Collection</b></div><div class="phone-visual"><div class="phone-screen"><div class="camera"></div></div></div><div class="float-tag tag-two">Premium tanlov<b>Top smartfonlar</b></div></div></section><section class="section" id="catalog"><div class="section-head"><div><div class="eyebrow">BIZNING KATALOG</div><h2>Ommabop telefonlar</h2><div class="muted" style="font-size:13px">Siz uchun tanlangan zamonaviy smartfonlar</div></div><span class="muted" style="font-size:12px">3 ta model</span></div><div class="products">${demoProducts.map((p,i)=>`<article class="product"><div class="product-art"><div class="mini-phone"></div></div><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="product-bottom"><span class="price">${p.price}</span><button onclick="alert('Buyurtma uchun: +998 90 000 00 00')">Batafsil ↗</button></div></article>`).join('')}</div><div class="features" id="why"><div class="feature"><div class="eyebrow">01 / SIFAT</div><strong>Original mahsulotlar</strong><p>Tanlangan smartfonlar va kafolatli xizmat.</p></div><div class="feature"><div class="eyebrow">02 / QULAYLIK</div><strong>Oson xarid</strong><p>O‘zingizga mos modelni tez va oson toping.</p></div><div class="feature"><div class="eyebrow">03 / YORDAM</div><strong>Maslahat va ko‘mak</strong><p>Tanlovdan foydalanishgacha siz bilanmiz.</p></div></div></section></main><footer class="footer"><span>© 2026 VOLTA. Barcha huquqlar himoyalangan.</span><span>Smart choice. Smart life.</span></footer>`;
 document.getElementById('logout').onclick=async()=>{await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});user=null;mode='login';authView()}}
async function start(){try{const r=await fetch('/.netlify/functions/api?action=me');if(r.ok){const d=await r.json();user=d.user;landingView();return}}catch(e){}authView()}start();
</script></body></html>
